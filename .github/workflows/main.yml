
name: Build Web2APK APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivos
        run: |
          echo "Conteúdo do repositório:"
          ls -la
          echo "Conteúdo de android-template:"
          ls -la android-template
          echo "Procurando arquivos Gradle:"
          find . -maxdepth 4 -type f \( -name 'gradlew' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' -o -name 'build.gradle' -o -name 'build.gradle.kts' \)
